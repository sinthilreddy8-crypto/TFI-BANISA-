<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TFI banisa</title>

<style>
/* Layout: one-screen game. Slim top bar (title + controls), 9:16 canvas stage centered below, fitted to the free space. Single committed look: temple-sunrise sky over a deep maroon frame. */
:root {
  --bg: #120a24;
  --bar-ink: #fff1d0;
  --btn: #ffc83d;
  --btn-ink: #3b1204;
  --btn-line: #8c2f12;
  --focus: #ffffff;
  --display: "Bungee", Impact, "Arial Black", sans-serif;
  --body: "Baloo Tammudu 2", "Noto Sans Telugu", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--bar-ink);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
}
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; letter-spacing: 0.04em; color: var(--btn); text-wrap: balance; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  appearance: none; cursor: pointer; font: 700 0.95rem/1 var(--body);
  min-height: 40px; padding: 0 14px; border-radius: 10px;
  background: var(--btn); color: var(--btn-ink); border: 2px solid var(--btn-line);
  display: inline-flex; align-items: center; justify-content: center;
}
.btn.ghost { background: transparent; color: var(--bar-ink); border-color: #5a3a8a; }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#stage { flex: 1; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
#game { display: block; border-radius: 14px; touch-action: none; background: #2b1458; box-shadow: 0 0 0 3px #6b3fa0, 0 10px 30px rgba(0,0,0,.5); cursor: pointer; }
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(18, 10, 36, 0.9); }
.card { width: min(100%, 360px); max-height: 100%; overflow: auto; box-sizing: border-box; background: #1d0f3a; border: 3px solid var(--btn); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { margin: 0; font: 400 1.4rem/1.1 var(--display); color: var(--btn); letter-spacing: 0.04em; text-wrap: balance; }
.card label { font-weight: 700; font-size: 0.95rem; }
.card input { min-height: 46px; box-sizing: border-box; width: 100%; border-radius: 10px; border: 2px solid #6b3fa0; background: #120a24; color: var(--bar-ink); padding: 0 12px; font: 700 1.1rem var(--body); }
.card input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.card p { margin: 0; font-size: 0.9rem; line-height: 1.35; color: #d9c8ff; }
.field { display: flex; flex-direction: column; gap: 6px; }
#boardList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
#boardList li { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: #2a1650; }
#boardList li.me { background: var(--btn); color: var(--btn-ink); }
#boardList li.empty { display: block; text-align: center; }
.rk, .sc { font-family: var(--display); font-variant-numeric: tabular-nums; }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.overlay[hidden] { display: none; }
.card.center { text-align: center; align-items: stretch; }
.card .big { font: 400 2.4rem/1 var(--display); color: var(--cream, #fff6e0); }
#winBox { overflow: hidden; background: radial-gradient(ellipse at 50% 30%, rgba(122,47,107,.55), rgba(11,10,42,.94) 70%); }
#confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.winCard { position: relative; width: min(100%, 340px); box-sizing: border-box; padding: 78px 20px 20px; margin-top: 46px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  background: linear-gradient(180deg, #2a1650, #1d0f3a 60%); border: 3px solid var(--btn); border-radius: 22px; box-shadow: 0 0 0 5px #120a24, 0 0 0 7px #6b3fa0, 0 0 60px rgba(255,200,61,.35); animation: cardIn .55s cubic-bezier(.2,1.4,.4,1) both; }
.winCard .rays { position: absolute; left: 50%; top: 0; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, rgba(255,200,61,.30) 0 10deg, rgba(255,200,61,0) 10deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 70%); mask-image: radial-gradient(circle, #000 25%, transparent 70%); animation: spin 14s linear infinite; }
.winCard > * { position: relative; z-index: 1; }
.winCard > .rays { position: absolute; }
.medal { position: absolute !important; left: 50%; top: -52px; margin-left: -52px; width: 104px; height: 104px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  background: radial-gradient(circle at 35% 30%, #fff1b0, #ffc83d 45%, #d98a12); border: 5px solid #8c2f12; box-shadow: 0 0 0 4px #120a24, 0 8px 22px rgba(0,0,0,.5), inset 0 -6px 10px rgba(140,47,18,.35); color: var(--btn-ink); animation: medalIn .7s .15s cubic-bezier(.2,1.5,.4,1) both; }
.lvlTag { font: 400 .72rem var(--display); letter-spacing: .12em; }
.lvlNum { font: 400 2.5rem var(--display); }
.winCard h2 { margin: 0; font: 400 1.9rem/1.05 var(--display); letter-spacing: .03em; color: var(--btn); text-shadow: 0 3px 0 #8c2f12, 0 0 22px rgba(255,200,61,.5); animation: pop .5s .35s cubic-bezier(.2,1.6,.4,1) both; }
.levelName { font: 400 1rem var(--display); letter-spacing: .12em; color: #fff6e0; animation: pop .5s .5s both; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 4px; animation: pop .5s .65s both; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; border-radius: 14px; background: #120a24; border: 2px solid #6b3fa0; }
.stat .k { font: 700 .75rem var(--body); letter-spacing: .14em; text-transform: uppercase; color: #d9c8ff; }
.stat .v { font: 400 2.2rem/1 var(--display); color: #fff6e0; font-variant-numeric: tabular-nums; }
.stat:first-child { border-color: var(--btn); }
.stat:first-child .v { color: var(--btn); }
.newbest { margin: 0; padding: 4px 14px; border-radius: 999px; background: #ff5a3c; color: #fff; font: 400 .9rem var(--display); letter-spacing: .08em; animation: wob 1s .9s ease-in-out infinite both; }
.nextbtn { width: 100%; min-height: 54px; margin-top: 6px; font: 400 1.25rem var(--display); letter-spacing: .06em; gap: 10px; box-shadow: 0 5px 0 var(--btn-line); animation: pulse 1.4s 1s ease-in-out infinite; }
.nextbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn-line); }
.winCard .ghost { width: 100%; }
@keyframes cardIn { from { transform: translateY(40px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes medalIn { from { transform: scale(0) rotate(-200deg); } to { transform: none; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { box-shadow: 0 5px 0 var(--btn-line), 0 0 24px 6px rgba(255,200,61,.65); } }
@keyframes wob { 50% { transform: rotate(-3deg) scale(1.06); } 0%, 100% { transform: rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .winCard, .winCard *, .medal { animation: none !important; } }
#levelGrid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
#levelGrid button { appearance: none; width: 100%; aspect-ratio: 1; border-radius: 10px; font: 400 1.05rem var(--display); cursor: pointer; border: 2px solid var(--btn-line); background: var(--btn); color: var(--btn-ink); }
#levelGrid button:disabled { background: #2a1650; color: #8f78c4; border-color: #4a2d78; cursor: not-allowed; }
#levelGrid button.cur { outline: 3px solid var(--focus); outline-offset: 2px; }
#levelGrid button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>

<div class="bar">
  <h1>TFI banisa</h1>
  <div class="tools">
    <button class="btn" id="levelsBtn" type="button">Levels</button>
    <button class="btn" id="lb" type="button">Leaderboard</button>
    <button class="btn ghost" id="who" type="button">Player</button>
    <button class="btn ghost" id="snd" type="button" aria-pressed="true">Sound: On</button>
  </div>
</div>
<div id="stage"><canvas id="game" width="360" height="640" aria-label="TFI banisa game. Tap, click or press space to fly."></canvas></div>

<div class="overlay" id="nameBox" role="dialog" aria-modal="true" aria-labelledby="nameTitle">
  <form class="card" id="nameForm">
    <h2 id="nameTitle">TFI banisa</h2>
    <div class="field">
      <label for="nameInput">Enter your name</label>
      <input id="nameInput" type="text" maxlength="16" autocomplete="nickname" placeholder="Your name" required>
    </div>
    <p>Your name shows on the leaderboard with your best score.</p>
    <button class="btn" type="submit">Play</button>
  </form>
</div>

<div class="overlay" id="winBox" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="winCard">
    <div class="rays" aria-hidden="true"></div>
    <div class="medal" aria-hidden="true"><span class="lvlTag">LEVEL</span><span class="lvlNum" id="winLvlNum">1</span></div>
    <h2 id="winTitle">Level Complete!</h2>
    <div class="levelName" id="winName">JAI BALAYA</div>
    <div class="stats">
      <div class="stat"><span class="k">Score</span><span class="v" id="winScore">20</span></div>
      <div class="stat"><span class="k">Best</span><span class="v" id="winBest">20</span></div>
    </div>
    <p class="newbest" id="winMsg" hidden>New best score!</p>
    <button class="btn nextbtn" id="nextBtn" type="button">Next Level <span aria-hidden="true">&#9654;</span></button>
    <button class="btn ghost" id="replayBtn" type="button">Play this level again</button>
  </div>
</div>

<div class="overlay" id="soonBox" role="dialog" aria-modal="true" aria-labelledby="soonTitle" hidden>
  <div class="card center">
    <h2 id="soonTitle">Level 2</h2>
    <div class="big">COMING SOON</div>
    <p>This level is not ready yet. Stay tuned!</p>
    <button class="btn" id="soonBack" type="button">Back to Level 1</button>
    <button class="btn ghost" id="soonLevels" type="button">All levels</button>
  </div>
</div>

<div class="overlay" id="levelBox" role="dialog" aria-modal="true" aria-labelledby="levelTitle" hidden>
  <div class="card">
    <h2 id="levelTitle">Choose Level</h2>
    <ol id="levelGrid"></ol>
    <p id="levelNote">Score 20 in a level to finish it.</p>
    <button class="btn" id="levelClose" type="button">Close</button>
  </div>
</div>

<div class="overlay" id="boardBox" role="dialog" aria-modal="true" aria-labelledby="boardTitle" hidden>
  <div class="card">
    <h2 id="boardTitle">Leaderboard</h2>
    <ol id="boardList"></ol>
    <p id="boardNote"></p>
    <button class="btn" id="boardClose" type="button">Close</button>
  </div>
</div>

  /* ---------- game logic ---------- */
  function gapSize() { return Math.max(150, 192 - score * 1.2); }
  function speed() { return 120 + Math.min(score * 2.5, 70); }

  function reset() {

  function flap() {

  }

  function act() {

  }

  window.addEventListener('keydown', function (e) {

  function hitRect(cx, cy, r, x, y, w, h) {

  }

  /* collision follows the bottle's real outline, row by row */

    var topY = p.gapY - BH, botY = p.gapY + p.gap;

  function update(dt) {

    if (shake > 0) shake = Math.max(0, shake - 30 * dt);

    if (state === 'ready') {
      bird.y = H / 2 - 40 + Math.sin(performance.now() / 260) * 8;
      bird.rot = 0;
      return;
    }
    if (state === 'win') return;

    bird.y += bird.vy * dt;

  function drawTile(tile, h, offset, y) {

      ctx.beginPath(); ctx.moveTo(x, y + 14); ctx.lineTo(x + 24, y + 14); ctx.lineTo(x + 12, y + 30); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,200,61,0.18)';
    for (var x2 = -groundX + 24; x2 < W + 48; x2 += 48) {
      ctx.beginPath(); ctx.moveTo(x2, y + 40); ctx.lineTo(x2 + 24, y + 40); ctx.lineTo(x2 + 12, y + 56); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
    if (sprite) {
      var S = 72, k = S / Math.max(sprite.width, sprite.height);
      var w = sprite.width * k, h = sprite.height * k;
      ctx.drawImage(sprite, -w / 2, -h / 2, w, h);
    }
    ctx.restore();
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = 'rgba(42,13,5,0.88)'; ctx.strokeStyle = C.gold; ctx.lineWidth = 4;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 18); else ctx.rect(x, y, w, h);
    ctx.fill(); ctx.stroke();
  }

  function draw() {
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawSky();
    for (var i = 0; i < pipes.length; i++) drawBottles(pipes[i]);
    drawGround();
    drawBird();
    ctx.restore();

    if (state === 'play') {
      outlineText(String(score), W / 2, 84, 60, C.cream, C.ink);
      outlineText('BEST ' + best, 14, 26, 15, C.cream, C.ink, 'left');
      outlineText('LEVEL ' + (curLevel + 1), W - 14, 26, 15, C.gold, C.ink, 'right');
      outlineText(score + ' / ' + lv().target, W - 14, 48, 12, C.cream, C.ink, 'right');
      if (milestoneBanner && performance.now() < milestoneBanner.until) {
        var elapsed = milestoneBanner.until - performance.now();
        var alpha = Math.min(1, elapsed / 500);
        ctx.save();
        ctx.globalAlpha = alpha;
        outlineText('JAI BALAYYA!', W / 2, 132, 24, C.gold, C.ink);
        outlineText(milestoneBanner.score + ' POINTS!', W / 2, 158, 14, C.cream, C.ink);
        ctx.restore();
      }
    }
    if (state === 'ready') {
      if (playerName) outlineText(playerName, W / 2, 90, 16, C.gold, C.ink);
      outlineText('TFI BANISA', W / 2, 60, 22, C.cream, C.ink);
      outlineText('LEVEL ' + (curLevel + 1), W / 2, 124, 20, C.cream, C.ink);
      var nm = lv().name.split(' ');
      outlineText(nm[0] || '', W / 2, 176, 54, C.gold, C.ink);
      if (nm.length > 1) outlineText(nm.slice(1).join(' '), W / 2, 232, 54, C.cream, C.ink);
      if (Math.floor(performance.now() / 500) % 2 === 0) outlineText('TAP TO FLY', W / 2, 440, 26, C.cream, C.ink);
      outlineText('Space / click / tap', W / 2, 480, 13, C.cream, C.ink);
      if (best) outlineText('BEST ' + best, W / 2, 520, 18, C.gold, C.ink);
    }
    if (state === 'over') {
      panel(24, 170, W - 48, 272);
      outlineText('MALA ADHU', W / 2, 216, 34, C.gold, C.ink);
      outlineText('RA BADCOW', W / 2, 260, 34, C.gold, C.ink);
      outlineText('SCORE ' + score, W / 2, 322, 26, C.cream, C.ink);
      outlineText('BEST ' + best, W / 2, 364, 20, C.gold, C.ink);
      var rk = rankOf();
      if (rk) outlineText('RANK #' + rk, W / 2, 396, 18, C.cream, C.ink);
      if (performance.now() - overAt > 450) outlineText('TAP TO PLAY AGAIN', W / 2, 428, 15, C.cream, C.ink);
    }
  }

  /* ---------- sizing + loop ---------- */
  function fit() {
    var r = stage.getBoundingClientRect();
    var w = r.width, h = r.height;
    if (w / h > W / H) w = h * W / H;
    w = Math.max(200, Math.floor(w));
    h = Math.floor(w * H / W);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);
  fit();
  buildScenery();

  /* each frame moves by its real elapsed time; long frames are cut into small steps */
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    var n = Math.max(1, Math.ceil(dt / (1 / 90))), h = dt / n;
    if (!uiOpen) for (var i = 0; i < n; i++) update(h);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
